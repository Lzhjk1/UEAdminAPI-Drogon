# Drogon 应用配置文件
# custom_config: 用户自定义配置，通过 app().getCustomConfig() 获取
custom_config:
  # 用户管理配置
  UserManage:
    jwt_issuer: UEAdminAPI
    jwt_secret: [这里填JWT密钥]
    tokenExpeirSec:  720          # Token 有效期（秒），默认 3600
    tokenFlashTokenSec: 259200    # FlashToken 有效期（秒），默认 259200
    ActionTokenSec: 300           # ActionToken 有效期（秒）
    # RSA 配置（用于 RS256 非对称签名）
    rsa_private_key: ""           # 私钥文件路径，留空则尝试 rsa_private_key_pem
    rsa_public_key: ""            # 公钥文件路径，留空则尝试 rsa_public_key_pem
    rsa_private_key_pem: ""       # 内嵌私钥 PEM 字符串
    rsa_public_key_pem: ""        # 内嵌公钥 PEM 字符串
    rsa_auto_generate: false      # 以上四项均空且此项为 true 时，启动时自动生成 2048 位密钥对

  # 邮箱服务配置
  Email:
    SmtpServer: smtp.qq.com
    SmtpPort: 587
    EmailSource: [这里填发件邮箱地址]
    EmailPassword: [这里填邮箱密码或授权码]
    ClaimedName: [这里填发件显示名称]
    ErrorPatterns:
      "The recipient may contain a non-existent account": "目标邮箱账号不存在"
      "Mailbox unavailable or access denied": "目标邮箱服务器不存在或没有访问权限"

  # 腾讯云短信服务配置
  SMS:
    Tencent:
      Host: sms.tencentcloudapi.com
      Region: ap-guangzhou
      SignName: [这里填短信签名]
      TemplateIds:
        Default: [这里填短信模板ID]
        Login: [这里填登录模板ID]
        Register: [这里填注册模板ID]
        ResetPassword: [这里填重置密码模板ID]
      SmsSdkApp:
        Id: [这里填SdkAppId]
        Key: [这里填SdkAppKey]
      Secret:
        Id: [这里填腾讯云SecretId]
        Key: [这里填腾讯云SecretKey]

  # GitLab 服务配置
  GitLab:
    AdminToken: [这里填GitLab管理员Token]
    ApiHost: [这里填GitLab API地址]

  # 服务器域名
  ServerHost: "[这里填服务器域名]"

  # 支付渠道（支付宝 / 微信支付）
  # Enabled 为总开关；任一渠道凭据不完整时该渠道下单返回 -906，不会退回模拟支付。
  # 真实渠道的回调地址默认取 ServerHost + 下列路径，也可用 NotifyUrl 单独覆盖。
  Payment:
    Enabled: false
    Alipay:
      Enabled: false
      AppId: ""                       # 开放平台应用 APPID
      Gateway: "https://openapi.alipay.com/gateway.do"
      Mode: "page"                    # page=电脑网站支付（浏览器收银台）；qr=订单码/当面付（应用内二维码）
      ProductCode: ""                 # 留空自动：page=FAST_INSTANT_TRADE_PAY；qr=QR_CODE_OFFLINE
      ReturnUrl: ""                   # 可选，支付完成后浏览器跳回的地址
      PrivateKeyPath: ""              # 应用私钥文件（与 PrivateKeyPem 二选一）
      PrivateKeyPem: ""               # 应用私钥 PEM 内容（PKCS#1 / PKCS#8）
      PublicKeyPath: ""               # 支付宝公钥文件（不是应用公钥）
      PublicKeyPem: ""                # 支付宝公钥 PEM / 纯 Base64
      NotifyUrl: ""                   # 留空 = ServerHost + /api/bill/notify/alipay
    WeChat:
      Enabled: false
      MchId: ""                       # 微信支付商户号
      AppId: ""                       # 与商户号绑定的服务号/小程序 APPID
      SerialNo: ""                    # 商户 API 证书序列号
      PrivateKeyPath: ""              # apiclient_key.pem
      PrivateKeyPem: ""               # 商户私钥 PEM 内容（与 PrivateKeyPath 二选一）
      ApiV3Key: ""                    # APIv3 密钥（32 位）
      PublicKeyId: ""                 # 微信支付公钥 ID（PUB_KEY_ID_ 开头）
      PublicKeyPath: ""               # pub_key.pem
      PublicKeyPem: ""                # 微信支付公钥 PEM 内容（与 PublicKeyPath 二选一）
      NotifyUrl: ""                   # 留空 = ServerHost + /api/bill/notify/wechat
      ApiBase: "https://api.mch.weixin.qq.com"

  # 第三方登录平台配置
  ThirdPartyPlatformInfo:
    QQ:
      ClientId: [这里填QQ ClientId]
      ClientSecret: [这里填QQ ClientSecret]
    WeChat:
      ClientId: [这里填微信 ClientId]
      ClientSecret: [这里填微信 ClientSecret]

  # 安装包存储（在线更新）
  Installer:
    StoreDir: "./installers"     # 安装包落盘目录（生产建议挂到独立磁盘卷）
    UploadTempDir: "./uploads/installer-tmp"   # 分片上传临时文件目录，需可写

  # 意见反馈截图存储（登录器「我的 → 意见反馈」）
  Feedback:
    StoreDir: "./uploads/feedback"   # 截图落盘目录，需可写

  # 测试模式配置 (自动化测试用, 生产环境务必保持 Enable: false)
  TestMode:
    Enable: false          # 测试模式总开关
    FixedCode: ""          # 测试模式下使用的固定验证码, 留空则随机生成
    ColdDownSec: 0         # 测试模式下的发送冷却时间(秒), 0 表示不限制
