name: C++ Build

on:
  push:
    branches:
      - '*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '覆盖默认分支名生成的标签后缀（Docker 标签/产物名使用）；留空则自动使用分支名'
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[build]') || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CI image
        uses: docker/build-push-action@v6
        with:
          context: ./build_docker
          file: ./build_docker/Dockerfile.build
          tags: ueadmin-api-drogon-build:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure and build
        shell: bash
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/mnt/project/ueadmin-api-drogon" \
            -w /mnt/project/ueadmin-api-drogon \
            ueadmin-api-drogon-build:ci \
            bash -lc '
              cmake . \
                -DCMAKE_TOOLCHAIN_FILE=/opt/vcpkg/scripts/buildsystems/vcpkg.cmake \
                -G Ninja \
                -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=gcc-16 \
                -DCMAKE_CXX_COMPILER=g++-16 && \
              cmake --build build --parallel
            '

      - name: Set branch name
        shell: bash
        run: |
          # 手动触发时可指定 tag_name 覆盖默认后缀；否则按分支名生成
          # 分支名用于 Docker 标签/产物命名；其中的 / 在 Docker 标签中非法，替换为 -（如 feature/foo -> feature-foo）
          if [ -n "${{ inputs.tag_name }}" ]; then
            BRANCH_SAFE="${{ inputs.tag_name }}"
          else
            BRANCH_SAFE="${GITHUB_REF_NAME//\//-}"
            # Docker 标签仅支持 ASCII，中文分支名需映射为 ASCII 别名；新增映射在此追加 case 分支
            case "${BRANCH_SAFE}" in
              "PDMS数据库拓展用后端") BRANCH_SAFE="PDMS" ;;
            esac
          fi
          echo "BRANCH_SAFE=${BRANCH_SAFE}" >> $GITHUB_ENV

      - name: Set short sha
        shell: bash
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build run image
        shell: bash
        run: |
          # 将编译产物放到 Dockerfile.run 期望的 context 路径下
          mkdir -p build_docker/ueadmin-api-drogon/build
          cp build/UEAdminAPI_drogon build_docker/ueadmin-api-drogon/build/
          docker build \
            -t ueadmin-api-drogon-run:ci \
            -t ${{ vars.DOCKERHUB_REPO }}:${{ env.BRANCH_SAFE }}-latest \
            -t ${{ vars.DOCKERHUB_REPO }}:${{ env.BRANCH_SAFE }}-${{ env.SHORT_SHA }} \
            -f build_docker/Dockerfile.run build_docker

      - name: Push to DockerHub
        shell: bash
        run: |
          docker push ${{ vars.DOCKERHUB_REPO }}:${{ env.BRANCH_SAFE }}-${{ env.SHORT_SHA }}
          docker push ${{ vars.DOCKERHUB_REPO }}:${{ env.BRANCH_SAFE }}-latest

      - name: Export run image
        shell: bash
        run: |
          docker save ueadmin-api-drogon-run:ci | gzip > ueadmin-api-drogon-run-ci-${{ env.BRANCH_SAFE }}.tar.gz

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: UEAdminAPI_drogon-linux-${{ env.BRANCH_SAFE }}
          path: build/UEAdminAPI_drogon
          if-no-files-found: error

      - name: Upload run image
        uses: actions/upload-artifact@v4
        with:
          name: UEAdminAPI_drogon-run-ci-image-${{ env.BRANCH_SAFE }}
          path: ueadmin-api-drogon-run-ci-${{ env.BRANCH_SAFE }}.tar.gz
          if-no-files-found: error

  build-windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[build]') || contains(github.event.head_commit.message, '[build]')
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      # 锁定 vcpkg 版本，保证 ports 与缓存产物一致；升级时改此值即可
      VCPKG_TAG: "2026.06.24"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set branch name
        shell: bash
        run: |
          # 手动触发时可指定 tag_name 覆盖默认后缀；否则按分支名生成
          # 分支名用于产物命名；其中的 / 不合法，替换为 -
          if [ -n "${{ inputs.tag_name }}" ]; then
            BRANCH_SAFE="${{ inputs.tag_name }}"
          else
            BRANCH_SAFE="${GITHUB_REF_NAME//\//-}"
            # Docker 标签仅支持 ASCII，中文分支名需映射为 ASCII 别名；新增映射在此追加 case 分支
            case "${BRANCH_SAFE}" in
              "PDMS数据库拓展用后端") BRANCH_SAFE="PDMS" ;;
            esac
          fi
          echo "BRANCH_SAFE=${BRANCH_SAFE}" >> $GITHUB_ENV

      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg
          key: vcpkg-${{ env.VCPKG_TAG }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_TAG }}-

      - name: Clone and bootstrap vcpkg
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:VCPKG_TAG https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Install dependencies
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          C:\vcpkg\vcpkg.exe install `
            jsoncpp:x64-windows `
            zlib:x64-windows `
            openssl:x64-windows `
            sqlite3:x64-windows `
            libpq:x64-windows `
            libpqxx:x64-windows `
            jwt-cpp:x64-windows `
            yaml-cpp:x64-windows `
            "drogon[ctl,sqlite3,postgres,orm,yaml]:x64-windows"

          # 清理中间构建产物，减小缓存体积
          Remove-Item -Recurse -Force C:\vcpkg\buildtrees -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force C:\vcpkg\packages -ErrorAction SilentlyContinue

      - name: Configure
        shell: pwsh
        run: |
          cmake . `
            -B build `
            -A x64 `
            -DCMAKE_CONFIGURATION_TYPES=Release `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: UEAdminAPI_drogon-windows-${{ env.BRANCH_SAFE }}
          path: build/Release/UEAdminAPI_drogon.exe
          if-no-files-found: error
